# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
#
# Run locally with `cargo deny check`. CI runs the same command in
# `.github/workflows/supply-chain.yml`.

[graph]
# Restrict checks to the targets we actually ship to. This avoids dragging
# in Windows-only / WASM-only deps when evaluating advisories or licenses.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
# `vulnerability` and `unmaintained` are the two we care most about. We let
# `unsound` and `notice` through because they're often informational and
# shouldn't block PRs without human review.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Allowlist approach: only licenses listed here pass. New transitive deps
# with an exotic license must be added explicitly so the implication is
# reviewed at PR time, not discovered at audit time.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []

[bans]
# Pretty strict; multiple-versions of the same crate is a common cause of
# binary bloat and version-drift bugs.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # `openssl-sys` is a foot-gun on cross-compiles; we use rustls
    # everywhere instead.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
skip-tree = []

[sources]
# Refuse anything fetched from outside crates.io. If we ever need a git
# dep, add it explicitly here so the choice is reviewed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
