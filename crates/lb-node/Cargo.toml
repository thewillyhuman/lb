[package]
name = "lb-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Enable the real AF_XDP packet I/O backend. Off by default so cargo
# build on dev machines (especially non-Linux) keeps working without
# kernel headers installed. Enable for production builds:
#   cargo build --release --features af-xdp
default = []
af-xdp = ["lb-io/af-xdp"]

[dependencies]
lb-types = { workspace = true }
lb-forwarder = { workspace = true }
lb-controller = { workspace = true }
lb-config-manager = { workspace = true }
lb-hashing = { workspace = true }
lb-metrics = { workspace = true }
lb-io = { workspace = true }
lb-bgp = { workspace = true }
lb-tracer = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
