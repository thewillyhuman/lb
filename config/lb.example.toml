# LB Node Configuration
# Deserialized by lb-types/src/config.rs

[node]
id              = "lb-node-01"
loopback_ip     = "188.184.0.1"   # this node's stable IP, used as GRE source
data_iface      = "eth0"          # NIC used for packet forwarding
num_threads     = 7               # packet rewriter threads (leave 1 core for steering/muxing)

[bgp]
local_asn       = 65000
router_id       = "188.184.0.1"
communities     = ["65000:100"]
next_hop_self   = true

# One BGP session is opened per entry. VIP announcements fan out to all
# Established peers; loss of any single peer does not remove the VIP from the
# other routers' tables (Maglev §4.2: N+1 redundancy, not active/passive).
[[bgp.peers]]
peer_ip         = "188.184.0.254"
peer_asn        = 65000

[[bgp.peers]]
peer_ip         = "188.184.0.253"
peer_asn        = 65000
# Optional per-peer overrides:
# port            = 179
# hold_time_secs  = 90
# communities     = ["65000:200"]
# enabled         = true

[control_plane]
config_file     = "/etc/lb/lb-config.json"   # LB config (VIPs + pools), watched via inotify (ADR-001)
local_cache     = "/var/lib/lb/config-cache.json"

[forwarder]
packet_pool_size       = 4096
connection_table_size  = 131072     # per thread, must be power of two. ≥ 2× peak concurrent flows.
fragment_table_size    = 8192
batch_size             = 64
batch_flush_interval   = "50us"
# Legacy single-TTL knob. Used as the default for tcp_established when
# [forwarder.connection_ttls] is not provided below.
connection_ttl         = "60s"
network_mtu            = 1500       # link MTU; derives inner MTU (1476) and TCP MSS clamp (1436)
icmp_rate_limit        = 100        # max ICMP Frag Needed responses/sec per VIP

# Optional per-protocol-and-state TTLs for the connection tracker.
# Matches Maglev (NSDI '16 §3.3): short TTL on TCP handshake to clear
# half-open connections, long TTL on established TCP, short TTL on closing
# TCP (FIN/RST seen) to reclaim slots promptly.
# [forwarder.connection_ttls]
# tcp_handshake   = "5s"
# tcp_established = "60s"
# tcp_closing     = "10s"
# udp             = "30s"
# other           = "30s"

[health_check_defaults]
interval             = "5s"
timeout              = "2s"
healthy_threshold    = 2
unhealthy_threshold  = 3
